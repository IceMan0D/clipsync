[package]
name = "clipsync-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hex = "0.4.3"
hkdf = "0.13.0"
clipsync-clipboard = { version = "0.1.0", path = "../clipboard" }
sha2 = "0.11.1"
snow = "0.10.0"
thiserror = "2.0.21"
mdns-sd = "0.21.6"
if-addrs = "0.15.0"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSOperation", "NSRunLoop", "NSString", "NSObject", "block2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
