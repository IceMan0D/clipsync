name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Generate platform icons (icns)
        working-directory: app
        run: cargo tauri icon icons/icon.png
      - name: Build installer
        working-directory: app
        run: cargo tauri build --target ${{ matrix.target }}
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(find target/${{ matrix.target }}/release/bundle -type f \( -name '*.dmg' -o -name '*-setup.exe' \))
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          for f in $files; do gh release upload "$GITHUB_REF_NAME" "$f" --clobber; done
