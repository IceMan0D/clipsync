[package]
name = "clipsync-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clipsync-core = { path = "../core" }
clipsync-clipboard = { path = "../clipboard" }
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }

[build-dependencies]
tauri-build = "2"
